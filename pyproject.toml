[project]
name = "nimbus-listing-agent"
version = "0.1.0"
description = "Agentic site-onboarding + deterministic nightly crawl for estate-agent listings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimbus"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/superpowers", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that hit the real network; excluded by default (run with -m live)",
]
testpaths = ["tests"]
